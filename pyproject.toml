[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Pure-Python shim. This package contains NO code — it exists only so that
# pre-commit (language: python) can `pip install` it and pull the prebuilt
# `knots` wheel from PyPI, putting the `knots` binary on the hook environment's
# PATH with no Rust compile. See README.md.
#
# The `knots==X` pin must match a version published to PyPI. Bump it with
# ./bump.sh <version> on each knots release, then tag this repo to match.
[project]
name = "knots-pre-commit"
version = "0.0.0"
description = "pre-commit hooks for knots, installing the prebuilt PyPI wheel (no Rust toolchain required)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "knots==1.15.1",
]

[project.urls]
Homepage = "https://github.com/brandon-arrendondo/knots-pre-commit"
Knots = "https://github.com/brandon-arrendondo/knots"
